<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Studio Board</title><style>:root{--bg:#f5f5f7;--panel:#fff;--line:rgba(60,60,67,.14);--text:#1d1d1f;--muted:#6e6e73;--blue:#0071e3;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}.wrap{display:grid;grid-template-columns:220px 1fr;min-height:100vh}.side{padding:18px;background:#f0f1f4;border-right:1px solid var(--line)}.side h3{margin:4px 0 14px}.side button{width:100%;min-height:44px;border:0;border-radius:14px;background:transparent;text-align:left;padding:0 12px;color:var(--muted);font-weight:620;margin-top:8px}.side button.active{background:#fff;color:var(--text);box-shadow:0 4px 18px rgba(0,0,0,.06)}main{padding:20px}.hero{display:flex;justify-content:space-between;gap:10px;align-items:center}.hero strong{font-size:2rem;letter-spacing:-.05em}.hero span{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:18px}.card{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:0 12px 30px rgba(0,0,0,.06)}.card strong{display:block;font-size:2rem;margin-top:14px}.bars{height:220px;display:grid;grid-template-columns:repeat(8,1fr);gap:10px;align-items:end}.bars i{display:block;border-radius:14px 14px 7px 7px;background:linear-gradient(180deg,#5ac8fa,#0071e3)}.list div{display:flex;justify-content:space-between;padding:12px 0;border-top:1px solid var(--line)}@media(max-width:850px){.wrap{grid-template-columns:1fr}.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><aside class="side"><h3>Work</h3><button class="active">Dashboard</button><button>Projects</button><button>Clients</button><button>Payments</button></aside><main><div class="hero"><div><strong>Hello Plodroid.</strong><div><span>Studio Board live concept</span></div></div><span>Updated today</span></div><div class="grid"><section class="card"><span>Monthly income</span><strong>$1,820</strong></section><section class="card"><span>Open projects</span><strong>06</strong></section><section class="card"><span>Pending invoices</span><strong>03</strong></section></div><div class="grid"><section class="card" style="grid-column:span 2"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px"><strong style="font-size:1rem;margin:0">Income trend</strong><span style="color:var(--muted)">Last 6 months</span></div><div class="bars"><i style="height:38%"></i><i style="height:48%"></i><i style="height:35%"></i><i style="height:72%"></i><i style="height:58%"></i><i style="height:64%"></i><i style="height:82%"></i><i style="height:90%"></i></div></section><section class="card"><strong style="font-size:1rem;margin:0">Recent projects</strong><div class="list"><div><span>Plexium</span><span>App</span></div><div><span>AA Sports</span><span>Client</span></div><div><span>Sindbad</span><span>Web</span></div><div><span>Portfolio</span><span>Live</span></div></div></section></div></main></div></body></html>
