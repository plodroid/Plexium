<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stock Viewer</title><style>:root{--bg:#f6f7fb;--panel:#fff;--line:rgba(60,60,67,.12);--text:#151518;--muted:#6e6e73;--accent:#0071e3;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}.wrap{display:grid;grid-template-columns:220px 1fr;min-height:100vh}.left{background:#eef1f7;padding:20px;border-right:1px solid var(--line)}button{font:inherit}.ticker{width:100%;min-height:44px;text-align:left;border:0;border-radius:14px;background:transparent;padding:0 12px;color:var(--muted);font-weight:650;margin-top:8px}.ticker.active{background:#fff;color:var(--text);box-shadow:0 8px 24px rgba(0,0,0,.06)}main{padding:24px}.card{background:var(--panel);border:1px solid var(--line);border-radius:26px;padding:18px;box-shadow:0 12px 24px rgba(0,0,0,.06)}.head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:12px}.head strong{font-size:2rem;letter-spacing:-.06em}.chart{width:100%;height:300px}.chart path{fill:none;stroke:var(--accent);stroke-width:5;stroke-linecap:round}.foot{display:flex;gap:10px;margin-top:10px}.foot span{padding:7px 10px;border-radius:999px;background:#eef4ff;color:var(--accent)}@media(max-width:820px){.wrap{grid-template-columns:1fr}}</style></head><body><div class="wrap"><aside class="left"><h3>Watchlist</h3><button class="ticker active" data-name="Apple Inc." data-price="$223.10" data-path="M10 130 C60 124, 90 90, 140 95 S220 150, 280 96 S330 60, 390 74">AAPL</button><button class="ticker" data-name="NVIDIA" data-price="$174.70" data-path="M10 150 C60 120, 110 126, 140 112 S220 78, 280 90 S330 130, 390 44">NVDA</button><button class="ticker" data-name="Microsoft" data-price="$520.80" data-path="M10 112 C50 100, 90 88, 130 96 S220 124, 260 102 S330 52, 390 66">MSFT</button><button class="ticker" data-name="AMD" data-price="$178.20" data-path="M10 144 C60 166, 100 88, 150 100 S220 116, 270 84 S330 90, 390 48">AMD</button></aside><main><section class="card"><div class="head"><div><strong id="name">Apple Inc.</strong><div style="color:var(--muted)">1 month trend</div></div><strong id="price">$223.10</strong></div><svg class="chart" viewBox="0 0 400 180" preserveAspectRatio="none"><path id="path" d="M10 130 C60 124, 90 90, 140 95 S220 150, 280 96 S330 60, 390 74"></path></svg><div class="foot"><span>1D</span><span>1W</span><span>1M</span><span>YTD</span></div></section></main></div><script>document.querySelectorAll('.ticker').forEach(b=>b.onclick=()=>{document.querySelectorAll('.ticker').forEach(t=>t.classList.remove('active'));b.classList.add('active');name.textContent=b.dataset.name;price.textContent=b.dataset.price;path.setAttribute('d',b.dataset.path);});</script></body></html>
