<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AA Sports</title><style>:root{--bg:#0d0d10;--panel:#17171c;--text:#f5f5f7;--muted:#aaaaaf;--line:rgba(255,255,255,.10);--gold:#f7c948;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif}*{box-sizing:border-box}body{margin:0;background:radial-gradient(800px 300px at 80% -10%,rgba(247,201,72,.20),transparent 65%),var(--bg);color:var(--text)}.wrap{padding:24px}.nav{display:flex;justify-content:space-between;align-items:center}.nav strong{font-size:2rem;letter-spacing:-.06em}.pill{padding:9px 12px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid var(--line)}.grid{display:grid;grid-template-columns:1.2fr .8fr;gap:18px;margin-top:18px}.card{background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.03));border:1px solid var(--line);border-radius:24px;padding:18px}.list div{display:grid;grid-template-columns:1fr auto auto;gap:12px;padding:14px 0;border-top:1px solid var(--line)}.list div:first-child{border-top:0}.badge{padding:6px 10px;border-radius:999px;background:rgba(247,201,72,.12);color:var(--gold)}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.metric strong{display:block;font-size:2rem;margin-top:10px}small{color:var(--muted)}@media(max-width:860px){.grid,.stats{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="nav"><div><strong>AA Sports</strong><div><small>Member tracker concept</small></div></div><div class="pill">24 checked in today</div></div><div class="grid"><section class="card"><strong>Members today</strong><div class="list"><div><span>Amine</span><span class="badge">Boxe</span><small>10:30</small></div><div><span>Sara</span><span class="badge">Cardio</span><small>11:15</small></div><div><span>Nour</span><span class="badge">Taekwondo</span><small>12:50</small></div><div><span>Rami</span><span class="badge">Gym</span><small>13:05</small></div></div></section><section class="stats"><article class="card metric"><small>Monthly revenue</small><strong>$640</strong></article><article class="card metric"><small>New members</small><strong>09</strong></article><article class="card metric"><small>Active plans</small><strong>58</strong></article><article class="card metric"><small>Classes today</small><strong>07</strong></article></section></div></div></body></html>
