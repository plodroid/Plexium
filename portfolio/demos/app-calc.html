<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Simple Calculator</title><style>:root{--bg:#0f1014;--panel:#1c1d22;--btn:#2a2c33;--op:#ff9f0a;--muted:#50545f;--text:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif}*{box-sizing:border-box}body{margin:0;display:grid;place-items:center;min-height:100vh;background:radial-gradient(500px 220px at 50% -5%,rgba(255,159,10,.18),transparent 70%),var(--bg)}.calc{width:min(430px,calc(100% - 24px));background:var(--panel);border:1px solid rgba(255,255,255,.06);border-radius:30px;padding:20px;box-shadow:0 28px 80px rgba(0,0,0,.45)}.display{height:104px;display:flex;align-items:flex-end;justify-content:flex-end;color:var(--text);font-size:3.2rem;padding:0 6px 12px;letter-spacing:-.06em}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}button{min-height:74px;border:0;border-radius:22px;background:var(--btn);color:var(--text);font:600 1.4rem -apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif}button.op{background:var(--op)}button.mute{background:var(--muted)}</style></head><body><div class="calc"><div class="display" id="d">0</div><div class="grid"><button class="mute" data-k="c">C</button><button data-k="(">(</button><button data-k=")">)</button><button class="op" data-k="/">÷</button><button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button><button class="op" data-k="*">×</button><button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button><button class="op" data-k="-">−</button><button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button><button class="op" data-k="+">+</button><button data-k="0">0</button><button data-k=".">.</button><button data-k="=">=</button><button class="op" data-k="%">%</button></div></div><script>let v='0';document.querySelectorAll('button').forEach(b=>b.onclick=()=>{let k=b.dataset.k;if(k==='c')v='0';else if(k==='='){try{v=String(Function(`return (${v})`)())}catch{v='Err'}}else v=(v==='0'||v==='Err')?k:v+k;d.textContent=v;});</script></body></html>
