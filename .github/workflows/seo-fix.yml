name: Apply SEO fixes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/seo-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch SEO metadata
        run: |
          python - <<'PY'
          from pathlib import Path

          browser = Path('browser/index.html')
          text = browser.read_text(encoding='utf-8')
          text = text.replace(
              '<meta name="Download Plex Browser, a fast and private desktop browser for Windows, macOS and Linux with cool features, customization and a clean modern interface." />',
              '<meta name="description" content="Download Plex Browser, a fast and private desktop browser for Windows, macOS and Linux with cool features, customization and a clean modern interface." />'
          )
          text = text.replace(
              '<meta property="og:url" content="https://plexium.rweb.site/" />',
              '<meta property="og:url" content="https://plexium.rweb.site/browser/" />'
          )
          canonical = '  <link rel="canonical" href="https://plexium.rweb.site/browser/" />\n'
          if 'rel="canonical"' not in text:
              text = text.replace('  <link rel="icon" type="image/png" href="assets/Icons/dark.png" />', canonical + '  <link rel="icon" type="image/png" href="assets/Icons/dark.png" />')
          browser.write_text(text, encoding='utf-8')

          minecraft = Path('minecraft/index.html')
          text = minecraft.read_text(encoding='utf-8')
          if 'rel="canonical"' not in text:
              text = text.replace(
                  '<link rel="icon" type="image/png" href="../assets/server-icon.png"><link rel="stylesheet" href="../style.css">',
                  '<link rel="canonical" href="https://plexium.rweb.site/minecraft/">\n<link rel="icon" type="image/png" href="../assets/server-icon.png"><link rel="stylesheet" href="../style.css">'
              )
          minecraft.write_text(text, encoding='utf-8')
          PY
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add browser/index.html minecraft/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix SEO metadata and canonicals"
          git push
